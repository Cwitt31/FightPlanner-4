name: Discord Release Announcement

on:
  release:
    types: [published]

jobs:
  announce:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning title=Missing Secret::No DISCORD_WEBHOOK_URL secret found. Skipping announcement."
            exit 0
          fi

          # Pass variables via ENV to prevent Bash quoting/newline issues with the body
          export RELEASE_NAME="${{ github.event.release.name || github.event.release.tag_name }}"
          export RELEASE_URL="${{ github.event.release.html_url }}"
          export RELEASE_BODY="${{ github.event.release.body }}"

          PAYLOAD=$(jq -n \
            --arg content "@everyone  **New FightPlanner beta Release!**" \
            --env title "RELEASE_NAME" \
            --env url "RELEASE_URL" \
            --env desc "RELEASE_BODY" \
            --arg color "16723325" \
            --arg author_name "FightPlanner Updates" \
            --arg icon_url "https://raw.githubusercontent.com/FIREXDF/FightPlanner-4/main/assets/images/logo.png" \
            '{
              content: $content,
              embeds: [{
                title: ENV.RELEASE_NAME,
                url: ENV.RELEASE_URL,
                description: ENV.RELEASE_BODY,
                color: ($color | tonumber),
                author: {
                   name: $author_name,
                   icon_url: $icon_url
                }
              }]
            }')

          echo "Sending payload to Discord..."
          
          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               $DISCORD_WEBHOOK_URL
