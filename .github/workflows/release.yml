name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version Type"
        required: true
        default: "custom"
        type: choice
        options:
          - alpha
          - beta
          - custom
      custom_version:
        description: "Custom Version (only if Type is custom)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    env:
      CI: true
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Calculate and set version
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/bump-version.js ${{ github.event.inputs.version_type }} ${{ github.event.inputs.custom_version }}
        
      - name: Configure Windows code signing
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "fightplanner.pfx"

          if (!(Test-Path $pfxPath)) {
            Write-Error "fightplanner.pfx not found at: $pfxPath"
            exit 1
          }

          if ("${{ secrets.WIN_CSC_KEY_PASSWORD }}" -eq "") {
            Write-Error "Secret WIN_CSC_KEY_PASSWORD is missing."
            exit 1
          }

          "WIN_CSC_LINK=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WIN_CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and publish (electron-builder)
        run: npm run dist -- --publish always

      - name: Upload dist artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/**
